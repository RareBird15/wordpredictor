[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordPredictor"
dynamic = ["version"]
description = "NVDA add-on for proactive word prediction"
maintainers = [
	{name = "Lanie Carmelo-Molinar", email = "lanie@lanie.work"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.txt"}
dependencies = []
[project.urls]
Repository = "https://github.com/RareBird15/wordPredictor"

# PEP 735 dependency groups
[dependency-groups]
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
l10n = [
	"nh3==0.3.2",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
lint = [
	"uv==0.11.15",
	"ruff==0.14.5",
	"prek==0.4.8",
	"pyright[nodejs]==1.1.407",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
	{ include-group = "lint" },
]

[tool.ruff]
line-length = 110

builtins = [
	"_",
	"ngettext",
	"pgettext",
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
"sconstruct" = ["F821"]

[tool.pyright]
venvPath = ".venv"
venv = "."
pythonPlatform = "Windows"
typeCheckingMode = "basic"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	".github/scripts",
	# NVDA source modules are not available outside the NVDA source tree.
	"addon/globalPlugins",
]

extraPaths = [
	"./addon",
]